<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NCBI Genome Explorer</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.4rem; }
  .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
  select, input, button { padding: 8px 10px; font-size: 1rem; }
  input { flex: 1; }
  button { cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 4px; }
  button:hover { background: #1d4ed8; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  th { background: #f4f4f4; }
  .error { color: #b91c1c; background: #fee2e2; padding: 10px; border-radius: 4px; }
  .meta { color: #666; font-size: 0.85rem; margin-top: 6px; }
</style>
</head>
<body>

<h1>NCBI Genome Explorer</h1>

<div class="search-box">
  <select id="searchType">
    <option value="accession">Accession</option>
    <option value="taxid">TaxID</option>
    <option value="organism">Organism name</option>
  </select>
  <input id="query" type="text" placeholder="e.g. GCF_000005845.2" />
  <button onclick="search()">Search</button>
</div>

<div id="results"></div>

<script>
async function search() {
  const type = document.getElementById('searchType').value;
  const query = document.getElementById('query').value.trim();
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = 'Loading...';

  if (!query) {
    resultsDiv.innerHTML = '<div class="error">Please enter a value.</div>';
    return;
  }

  const url = `/genomes/${type}/${encodeURIComponent(query)}`;

  try {
    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      resultsDiv.innerHTML = `<div class="error">${data.detail}</div>`;
      return;
    }

    renderResults(type, data);
  } catch (err) {
    resultsDiv.innerHTML = `<div class="error">Network error: ${err.message}</div>`;
  }
}

function renderResults(type, data) {
  const resultsDiv = document.getElementById('results');
  const assemblies = type === 'accession' ? [data] : data.assemblies;

  if (!assemblies || assemblies.length === 0) {
    resultsDiv.innerHTML = '<div class="error">No results found.</div>';
    return;
  }

  let html = '<table><tr><th>Accession</th><th>Organism</th><th>TaxID</th><th>Level</th><th>Submitter</th></tr>';
  for (const a of assemblies) {
    html += `<tr>
      <td>${a.accession}</td>
      <td>${a.organism_name}</td>
      <td>${a.tax_id ?? ''}</td>
      <td>${a.assembly_level ?? ''}</td>
      <td>${a.submitter ?? ''}</td>
    </tr>`;
  }
  html += '</table>';

  if (type !== 'accession') {
    html += `<div class="meta">Showing ${assemblies.length} of ${data.total_count} total results</div>`;
  }

  resultsDiv.innerHTML = html;
}

document.getElementById('query').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') search();
});
</script>

</body>
</html>
